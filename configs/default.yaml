schema_version: "1.0"
project_name: lightweight-clinical-decision-support

data:
  output_dir: artifacts/datasets/clinical-qa
  cache_dir: data/cache
  download_if_missing: true
  retain_exact_duplicates: true
  expected_total: 26412
  wikidoc:
    repo_id: medalpaca/medical_meadow_wikidoc
    revision: 976bce16fd66f55e6828422b71249a7405a11aa4
    split: train
    expected_count: 10000
    local_path: null
    license: CC-BY-SA-3.0
  medquad:
    repository_url: https://github.com/abachaa/MedQuAD
    revision: 577bd37b96c02d1833b2c9eed2de9f96964e96cb
    expected_count: 16412
    local_path: null
    license: CC-BY-4.0

training:
  dataset_path: artifacts/datasets/clinical-qa/training.jsonl
  output_dir: artifacts/training/qlora-adapter
  base_model: meta-llama/Llama-3.2-3B-Instruct
  model_revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  minimum_gpu_memory_gib: 20.0
  epochs: 1
  max_sequence_length: 2048
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  drop_incomplete_accumulation: true
  learning_rate: 0.0002
  optimizer: adamw_8bit
  scheduler: linear
  warmup_steps: 0
  seed: 3407
  fp16: true
  bf16: false
  packing: false
  completion_only_loss: true
  quantization:
    load_in_4bit: true
    quant_type: nf4
    double_quantization: true
    compute_dtype: float16
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    bias: none
    target_modules: [q_proj, v_proj]

evaluation:
  base_model: meta-llama/Llama-3.2-3B-Instruct
  model_revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  adapter_path: artifacts/training/qlora-adapter/adapter
  output_dir: artifacts/evaluation/base-vs-adapter
  num_fewshot: 0
  batch_size: 4
  device: cuda:0
  seed: 3407
  log_samples: true
  tasks:
    - medmcqa
    - mmlu_anatomy
    - mmlu_clinical_knowledge
    - mmlu_high_school_biology
    - mmlu_college_biology
    - mmlu_college_medicine
    - mmlu_medical_genetics
    - mmlu_professional_medicine

rag:
  input_paths: [fixtures/rag/documents]
  index_dir: artifacts/indexes/synthetic-clinical
  evaluation_queries: fixtures/rag/queries.jsonl
  evaluation_output_dir: artifacts/evaluation/rag-synthetic
  embedding_model: intfloat/e5-large-v2
  embedding_revision: f169b11e22de13617baa190a028a32f3493550b6
  chunk_size: 512
  chunk_overlap: 64
  document_candidates: 8
  final_chunks: 8
  rank_constant: 60
  minimum_score: 0.025
  keyword_weight: 0.01
  recency_weight: 0.02
  recency_half_life_days: 730
  reference_date: 2026-09-17
  context_token_budget: 4096
  source_scope: user-supplied research documents

generation:
  base_model: meta-llama/Llama-3.2-3B-Instruct
  model_revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  adapter_path: artifacts/training/qlora-adapter/adapter
  max_new_tokens: 768
  do_sample: false
  temperature: 0.0
