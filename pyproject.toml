[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lightweight-cds"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
train = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "datasets==4.1.1",
  "peft==0.21.0",
  "transformers==5.17.0",
  "trl==1.13.0",
  "unsloth==2026.9.5",
]
eval = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "lm-eval[hf,tasks]==0.4.13",
  "peft==0.21.0",
  "transformers==5.17.0",
]
rag = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "faiss-cpu==1.15.1",
  "numpy==2.2.6",
  "peft==0.21.0",
  "pypdf==6.12.2",
  "sentence-transformers==6.0.1",
  "transformers==5.17.0",
]
dev = [
  "mypy==1.18.1",
  "pytest==8.4.2",
  "ruff==0.13.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/lightweight_cds"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lightweight_cds"]
